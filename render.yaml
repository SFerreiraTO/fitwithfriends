services:
  - type: web
    name: fitwithfriends
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push --accept-data-loss && node src/index.js
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fitwithfriends-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MAGIC_LINK_EXPIRES_MINUTES
        value: 15
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: fitwithfriends-db
    databaseName: fitwithfriends
    plan: free
